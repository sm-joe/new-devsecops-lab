version: "1.0"

hard_block:
  secrets:
    enabled: true

  critical_exploitable_cves:
    enabled: true
    severity:
      - CRITICAL
    exploitable: true

  direct_data_exposure:
    enabled: true

soft_fail:
  severities:
    - HIGH
    - MEDIUM
    - LOW

remediation_sla_days:
  CRITICAL: 14
  HIGH: 30
  MEDIUM: 60
  LOW: 60

exceptions:
  maximum_days: 180
  required_fields:
    - finding
    - justification
    - owner
    - compensating_controls
    - expiry