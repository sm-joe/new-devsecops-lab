name: Gitleaks Security Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks-security-gate:
    name: Gitleaks Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install security gate dependency
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Create security gate input
        env:
          GITLEAKS_EXIT_CODE: ${{ steps.gitleaks.outcome }}
        run: |
          if [ "$GITLEAKS_EXIT_CODE" = "failure" ]; then
            cat > gitleaks-findings.json <<'EOF'
          [
            {
              "id": "GITLEAKS-DETECTION",
              "type": "secret",
              "severity": "HIGH",
              "exploitable": true,
              "source": "gitleaks"
            }
          ]
          EOF
          else
            echo "[]" > gitleaks-findings.json
          fi

      - name: Run security gate
        run: |
          python security/security_gate.py gitleaks-findings.json