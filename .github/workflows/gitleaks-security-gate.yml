name: Gitleaks Security Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks-security-gate:
    name: Gitleaks Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            git
            --report-format json
            --report-path gitleaks-report.json
            --redact

      - name: Verify Gitleaks report
        if: always()
        run: |
          if [ ! -f gitleaks-report.json ]; then
            echo "Gitleaks did not produce a report."
            exit 1
          fi

          echo "Gitleaks report generated successfully."

      - name: Install security gate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Normalize Gitleaks findings
        run: |
          python security/gitleaks_to_findings.py \
            gitleaks-report.json \
            gitleaks-findings.json

      - name: Run security gate
        run: |
          python security/security_gate.py gitleaks-findings.json