name: OSV Security Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  osv-security-gate:
    name: OSV Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        continue-on-error: true
        with:
          scan-args: |-
            scan source -r app/ --format json --output osv-report.json

      - name: Verify OSV report
        run: |
          if [ ! -f osv-report.json ]; then
            echo "ERROR: OSV report was not generated."
            exit 1
          fi

          echo "OSV report generated successfully."

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install security gate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Normalize OSV findings
        run: |
          python security/osv_to_findings.py \
            osv-report.json \
            osv-findings.json

      - name: Run security gate
        run: |
          python security/security_gate.py osv-findings.json