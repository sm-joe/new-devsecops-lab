name: Semgrep SAST

on:
  pull_request:
    paths:
      - 'app/**'
      - '.semgrep.yml'
      - '.github/workflows/semgrep.yml'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.semgrep.yml'
      - '.github/workflows/semgrep.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=.semgrep.yml \
            --error \
            app/
