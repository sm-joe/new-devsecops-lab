name: Trivy Security Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  trivy-security-gate:
    name: Trivy Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          version: "v0.74.0"
          scan-ref: app/
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-report.json
          exit-code: "0"

      - name: Verify Trivy report
        run: |
          if [ ! -f trivy-report.json ]; then
            echo "ERROR: Trivy report was not generated."
            exit 1
          fi

          echo "Trivy report generated successfully."

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install security gate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Normalize Trivy findings
        run: |
          python security/trivy_to_findings.py \
            trivy-report.json \
            trivy-findings.json

      - name: Run security gate
        run: |
          python security/security_gate.py trivy-findings.json